# Describes this module to Backstage (https://backstage.altissimo.io), which
# discovers it hourly. Same shape as altissimo-hq/backstage's catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: terraform-google-folders
  namespace: altissimo
  description: Creates Google Cloud Folders and IAM Policies
  annotations:
    github.com/project-slug: altissimo-hq/terraform-google-folders
    altissimo.io/terraform-registry: altissimo-hq/folders/google
  tags:
    - folders
    - google
    - terraform
    - terraform-modules
  links:
    - url: https://registry.terraform.io/modules/altissimo-hq/folders/google/latest
      title: Terraform Registry
      icon: web
spec:
  type: terraform-module
  lifecycle: production
  owner: group:default/altissimo-agent
  system: altissimo/terraform-modules
